<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.json" />
    <title>Student Attendance Management System (SAMS)</title>
  </head>
  <body class="bg-slate-50 text-slate-800 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SAMS Offline SW Registered:', reg.scope))
            .catch(err => console.error('SAMS SW Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
